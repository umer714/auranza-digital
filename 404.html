.brand{display:inline-block;color:var(--gold2);font:800 .84rem/1.4 Manrope,Arial,sans-serif;letter-spacing:.3em;text-decoration:none}

.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:12px 20px;border:1px solid rgba(214,183,122,.55);color:var(--gold2);text-decoration:none;font-weight:700;transition:transform .2s ease,background .2s ease,color .2s ease}
.btn.primary{background:var(--gold2);border-color:var(--gold2);color:#17130c}
.btn:hover{transform:translateY(-2px);background:var(--gold2);color:#17130c}
.small{margin-top:30px;font-size:.8rem;color:#77736c}
:focus-visible{outline:2px solid var(--gold2);outline-offset:5px}
@media(max-width:420px){body{padding:14px}main{padding:28px 20px}.actions{flex-direction:column}.btn{width:100%}}
